<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 280" width="400" height="280">
  <defs>
    <linearGradient id="bg1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#faf6f1"/>
      <stop offset="100%" stop-color="#f0e8df"/>
    </linearGradient>
    <linearGradient id="gold1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#c4956a"/>
      <stop offset="100%" stop-color="#a87a52"/>
    </linearGradient>
  </defs>
  <rect width="400" height="280" fill="url(#bg1)" rx="0"/>
  <rect x="12" y="12" width="376" height="256" fill="none" stroke="url(#gold1)" stroke-width="1.5"/>
  <rect x="18" y="18" width="364" height="244" fill="none" stroke="url(#gold1)" stroke-width="0.5"/>
  <!-- Seal -->
  <circle cx="200" cy="58" r="22" fill="none" stroke="#c4956a" stroke-width="1"/>
  <circle cx="200" cy="58" r="17" fill="none" stroke="#c4956a" stroke-width="0.5"/>
  <text x="200" y="63" text-anchor="middle" font-family="serif" font-size="14" fill="#c4956a" font-weight="700">MFU</text>
  <!-- Title -->
  <text x="200" y="105" text-anchor="middle" font-family="serif" font-size="11" fill="#1a1f3a" letter-spacing="3" font-weight="400">CERTIFICATE OF COMPLETION</text>
  <line x1="120" y1="112" x2="280" y2="112" stroke="#c4956a" stroke-width="0.5"/>
  <!-- Institution -->
  <text x="200" y="135" text-anchor="middle" font-family="serif" font-size="15" fill="#1a1f3a" font-weight="600">Mae Fah Luang University</text>
  <text x="200" y="153" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#8a8a96" letter-spacing="1">SCHOOL OF ANTI-AGING &amp; REGENERATIVE MEDICINE</text>
  <!-- Body -->
  <text x="200" y="178" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#4a4a56">This certifies that the holder has successfully completed</text>
  <text x="200" y="193" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#4a4a56">the Advanced Aesthetic Medicine Training Program</text>
  <!-- Name placeholder -->
  <line x1="130" y1="218" x2="270" y2="218" stroke="#1a1f3a" stroke-width="0.5"/>
  <text x="200" y="215" text-anchor="middle" font-family="serif" font-size="13" fill="#1a1f3a" font-style="italic">Dr. Placeholder</text>
  <text x="200" y="232" text-anchor="middle" font-family="sans-serif" font-size="8" fill="#8a8a96" letter-spacing="1">CERTIFIED PRACTITIONER</text>
  <!-- Date -->
  <text x="200" y="254" text-anchor="middle" font-family="sans-serif" font-size="8" fill="#8a8a96">Issued: January 2024</text>
