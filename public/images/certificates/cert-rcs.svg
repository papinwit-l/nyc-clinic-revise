<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 280" width="400" height="280">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#faf6f1"/>
    </linearGradient>
    <linearGradient id="gold2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#c4956a"/>
      <stop offset="100%" stop-color="#a87a52"/>
    </linearGradient>
  </defs>
  <rect width="400" height="280" fill="url(#bg2)" rx="0"/>
  <rect x="10" y="10" width="380" height="260" fill="none" stroke="#1a1f3a" stroke-width="2"/>
  <rect x="16" y="16" width="368" height="248" fill="none" stroke="url(#gold2)" stroke-width="0.5"/>
  <!-- Crest -->
  <rect x="180" y="32" width="40" height="40" fill="none" stroke="#1a1f3a" stroke-width="1" transform="rotate(45 200 52)"/>
  <text x="200" y="57" text-anchor="middle" font-family="serif" font-size="12" fill="#1a1f3a" font-weight="700">RCS</text>
  <!-- Title -->
  <text x="200" y="95" text-anchor="middle" font-family="serif" font-size="10" fill="#1a1f3a" letter-spacing="4" font-weight="400">FELLOWSHIP DIPLOMA</text>
  <line x1="100" y1="102" x2="300" y2="102" stroke="#1a1f3a" stroke-width="0.5"/>
  <!-- Institution -->
  <text x="200" y="125" text-anchor="middle" font-family="serif" font-size="14" fill="#1a1f3a" font-weight="600">Royal College of Surgeons</text>
  <text x="200" y="143" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#8a8a96" letter-spacing="1">FACULTY OF AESTHETIC SURGERY</text>
  <!-- Body -->
  <text x="200" y="170" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#4a4a56">This diploma is awarded in recognition of</text>
  <text x="200" y="185" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#4a4a56">demonstrated excellence in surgical practice</text>
  <!-- Name -->
  <line x1="130" y1="212" x2="270" y2="212" stroke="#1a1f3a" stroke-width="0.5"/>
  <text x="200" y="209" text-anchor="middle" font-family="serif" font-size="13" fill="#1a1f3a" font-style="italic">Dr. Placeholder</text>
  <text x="200" y="226" text-anchor="middle" font-family="sans-serif" font-size="8" fill="#8a8a96" letter-spacing="1">FELLOW</text>
  <text x="200" y="252" text-anchor="middle" font-family="sans-serif" font-size="8" fill="#8a8a96">Issued: March 2023</text>
</svg>
